name: hrmis_new
description: AIDC HRMIS - Human Resource Management Information System
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ─────────────────────────────────────────────
  provider: ^6.1.2

  # ─── UI & Fonts ───────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.0

  # ─── Utilities ────────────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  camera: ^0.12.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  dio: ^5.4.3+1
  table_calendar: ^3.1.3
  device_info_plus: ^10.1.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aidc_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/aidc_logo.png"